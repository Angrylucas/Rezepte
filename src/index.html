<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f3ee">
  <script>
    // Gewähltes Design vor dem Rendern setzen, damit nichts aufblitzt.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (t) document.documentElement.setAttribute('data-theme', t);
      document.documentElement.classList.toggle('is-dark', dark);
      document.querySelector('meta[name="theme-color"]').content = dark ? '#171a17' : '#f6f3ee';
    })();
  </script>
  <title>Rezepte</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span aria-hidden="true">🥗</span> Rezepte</a>
    <button type="button" class="theme-toggle" aria-label="Dunkles Design einschalten">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <main id="app" tabindex="-1"><p class="loading">Lade Rezepte …</p></main>
  <footer class="footer"><a href="#/grundlagen">Grundlagen</a></footer>
  <script src="app.js" defer></script>
</body>
</html>
