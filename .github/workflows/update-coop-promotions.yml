name: Aktualisiere Coop-Aktionen

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP-Client installieren
        run: npm install --no-save --package-lock=false @modelcontextprotocol/sdk
      - name: Aktuelle Coop-Aktionen abrufen
        run: node scripts/fetch-coop-promotions.mjs
      - name: Aktualisierte Daten committen
        run: |
          if git diff --quiet -- src/coop-promotions.json; then
            echo "Keine Änderungen an den Coop-Aktionen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/coop-promotions.json
          git commit -m "chore: update Coop promotions"
          git push
